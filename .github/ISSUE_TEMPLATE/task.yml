name: Task
description: 기능 구현과 버그 수정 외의 개발 작업을 등록합니다.
title: "[Task] "
type: task
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 수행할 작업을 설명해 주세요.
    validations:
      required: true

  - type: input
    id: traceability
    attributes:
      label: 관련 요구사항 및 설계
      description: 추적이 필요한 요구사항이나 설계사항이 있을 때만 링크를 작성해 주세요.
      placeholder: Notion 링크
    validations:
      required: false
