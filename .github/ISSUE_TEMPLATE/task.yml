name: Task
description: 기능 구현과 버그 수정 외의 작업을 요청합니다.
title: "[Task] "
type: task
body:
  - type: textarea
    id: description
    attributes:
      label: 요청 내용
      description: 수행해야 하는 작업을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: traceability
    attributes:
      label: 관련 요구사항 및 설계
      description: 관련 요구사항이나 설계가 있다면 항목마다 이름과 링크를 한 줄씩 작성해 주세요.
      placeholder: |
        - [요구사항 1 이름](Notion 링크)
        - [요구사항 2 이름](Notion 링크)
        - [설계 1 이름](Notion 링크)
        - [설계 2 이름](Notion 링크)
    validations:
      required: false
