name: Feature
description: 요구사항과 설계에 따라 기능을 구현합니다.
title: "[Feature] "
type: feature
body:
  - type: textarea
    id: description
    attributes:
      label: 내용
      description: 구현할 기능과 목적을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 기준
      description: 기능이 완료되었다고 판단할 수 있는 기준을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: traceability
    attributes:
      label: 관련 요구사항 및 설계
      description: 관련 요구사항이나 설계가 있다면 항목마다 이름과 링크를 한 줄씩 작성해 주세요.
      placeholder: |
        - [요구사항 1 이름](Notion 링크)
        - [요구사항 2 이름](Notion 링크)
        - [설계 1 이름](Notion 링크)
        - [설계 2 이름](Notion 링크)
    validations:
      required: false
